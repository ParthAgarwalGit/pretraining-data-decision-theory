[project]
name = "pdt"
version = "0.0.0"
description = "A statistical decision theory for pretraining-data selection: extrapolated best-arm identification for LLM data-recipe choice."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
# Numerical core: arrays, stats, dataframes, columnar I/O.
core = [
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.2",
    "polars>=1.9",
    "pyarrow>=17.0",
]
# Hugging Face Hub access for DataDecide / Pythia / OLMo artifacts.
hub = [
    "huggingface_hub>=0.35",
    "datasets>=3.0",
]
# scipy.optimize (already in `core`) plus statsmodels for scaling-law fits
# and the delta-method sandwich covariance used by src/pdt/theory/bound.py.
fitting = [
    "statsmodels>=0.14",
]
# Figures. Deliberately no seaborn -- figure style is controlled by
# src/pdt/viz/ per plan/02-phase1-datadecide.md task P1-11.
plotting = [
    "matplotlib>=3.9",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
]
# NOTE: no `train` extra yet. Torch and the training stack are added in
# task P4-01, deliberately kept out of the default environment until then --
# see plan/05-phase4-training.md.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdt"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Restrict to real code. plan/, docs/, and paper/ contain illustrative
# Python-like pseudocode in markdown fences (interface sketches with `...`
# bodies) that is not meant to compile or be reformatted as source.
include = ["src/**/*.py", "experiments/**/*.py", "tests/**/*.py", "tools/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# --cov-fail-under enforced here (not just in CI) so `make test` fails the
# same way locally as it does on ubuntu-latest -- one source of truth.
addopts = "--cov=src/pdt --cov-report=term-missing --cov-fail-under=70"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
